app = "rahatla-api-eren"
primary_region = "ams"

[deploy]
  release_command = "npx prisma migrate deploy"
  wait_timeout = "10m"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

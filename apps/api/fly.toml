# fly.toml app configuration file generated for rahatla-api-eren on 2026-05-01T14:47:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rahatla-api-eren'
primary_region = 'ams'

[build]

[deploy]
  wait_timeout = '10m0s'
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
